{% extends "layouts/base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div class="container">

    <div class="row mb-4">

        <div class="col">

            <h2>
                Welcome,
                {{ user.full_name }}
                👋
            </h2>

            <p class="text-muted">
                Smart Inventory Dashboard
            </p>

        </div>

    </div>

    <div class="row">

        <!-- Products -->
        <div class="col-md-3 mb-3">

            <div class="card text-center shadow">

                <div class="card-body">

                    <h5>Total Products</h5>

                    <h2>0</h2>

                </div>

            </div>

        </div>

        <!-- Suppliers -->
        <div class="col-md-3 mb-3">

            <div class="card text-center shadow">

                <div class="card-body">

                    <h5>Suppliers</h5>

                    <h2>0</h2>

                </div>

            </div>

        </div>

        <!-- Low Stock -->
        <div class="col-md-3 mb-3">

            <div class="card text-center shadow">

                <div class="card-body">

                    <h5>Low Stock</h5>

                    <h2>0</h2>

                </div>

            </div>

        </div>

        <!-- Sales -->
        <div class="col-md-3 mb-3">

            <div class="card text-center shadow">

                <div class="card-body">

                    <h5>Today's Sales</h5>

                    <h2>0</h2>

                </div>

            </div>

        </div>

    </div>

    <div class="card shadow mt-4">

        <div class="card-header">

            Quick Actions

        </div>

        <div class="card-body">

            <button class="btn btn-primary">
                Add Product
            </button>

            <button class="btn btn-success">
                Add Supplier
            </button>

            <button class="btn btn-warning">
                View Inventory
            </button>

        </div>

    </div>

</div>

{% endblock %}
